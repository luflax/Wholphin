name: Improvements build

on:
  push:
    branches:
      - improvements
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BRANCH_NAME: ${{ github.ref_name }}
  TAG_NAME: improvements
  GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx12g -XX:MaxMetaspaceSize=1024m'"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Need the tags to build

      # The runner already has the Android SDK. No NDK (nothing native is compiled) or
      # Python (only used by pre-commit) needed.
      - name: Setup JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: zulu
          java-version: '21'

      # Persists dependencies and the Gradle build cache between runs, so unchanged
      # code isn't recompiled. Writes are allowed even though this isn't the default branch.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Get version name
        run: |
          if ! VERSION_NAME=$(git describe --tags --match 'v*' --long); then
            echo "::error::No v* tags found. Push them to this repo with: git push <remote> --tags"
            exit 1
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      # No release keystore: sign with the auto-generated Android debug key so the APK is
      # installable. The key is cached so that successive builds can update each other.
      - name: Restore debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: wholphin-debug-keystore

      # No `clean` (the runner starts empty) and no release lint check
      - name: Build release APK
        run: |
          echo "release.signing.config=debug" > local.properties
          ./gradlew assembleDefaultRelease -x lintVitalDefaultRelease

      # The in-app updater looks for an asset named Wholphin-release.apk
      - name: Rename APK
        run: |
          mkdir -p dist
          apks=(app/build/outputs/apk/default/release/*.apk)
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one APK, found: ${apks[*]}"
            exit 1
          fi
          cp "${apks[0]}" dist/Wholphin-release.apk
          sha256sum dist/*.apk

      - name: Upload mapping files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mapping
          path: app/build/outputs/**/mapping.txt
          compression-level: 6

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "$TAG_NAME" --cleanup-tag -y || true

          gh release create "$TAG_NAME" \
            --latest=false --prerelease \
            --title "$VERSION_NAME" \
            --target "$GITHUB_SHA" \
            --notes "Build of \`$BRANCH_NAME\` at $GITHUB_SHA (armeabi-v7a). Signed with a CI debug key, not the official release key." \
            dist/*.apk
